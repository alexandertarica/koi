<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263c63">
  <meta name="description" content="A click-through tour of real Koi iPhone app screens, followed by a short survey.">
  <title>Koi — iPhone app tour</title>
  <link rel="preload" href="assets/RobotoMono-Light.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/water.png" as="image">
  <link rel="stylesheet" href="tour.css?v=4">
</head>
<body>
  <main class="tour-shell">
    <header class="tour-header">
      <a class="tour-brand" href="./" aria-label="Koi tour home"><img src="assets/wordmark.png" alt="Koi"></a>
      <p class="tour-label">Tour · real screens from the Koi iPhone app</p>
      <a class="live-link" href="app/" id="live-link">Try the live version <span aria-hidden="true">→</span></a>
    </header>
    <section class="tour-layout" id="tour-layout" aria-live="polite">
      <div class="tour-copy" id="tour-copy"></div>
      <div class="phone-wrap" id="phone-wrap">
        <div class="phone-frame">
          <img class="tour-screen" id="tour-screen" src="assets/tour/01-hub.png" alt="Koi iPhone app screen">
          <button class="hotspot" id="hotspot" type="button" aria-label="Continue tour"><span class="hotspot-ring"></span><span class="hotspot-arrow">↗</span></button>
        </div>
      </div>
    </section>
    <footer class="tour-footer"><span>Tap the highlighted area or use your arrow keys.</span><span>Made for a calmer, more connected day.</span></footer>
  </main>
  <script src="tour.js?v=2" defer></script>
</body>
</html>
