<!doctype html>
<html lang="en">
  <head>
    <base href="../">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b4067">
    <meta name="description" content="Try Koi in your browser. One score for habits, food and movement.">
    <title>Koi — Browser demo</title>
    <link rel="preload" href="assets/RobotoMono-Light.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/water.png" as="image">
    <link rel="stylesheet" href="styles.css?v=11">
  </head>
  <body>
    <main class="demo-shell">
      <header class="demo-bar">
        <a class="brand-link" href="./" aria-label="Koi browser demo">
          <img class="brand-logo" src="assets/wordmark.png" width="92" alt="Koi">
          <span class="demo-label">BROWSER DEMO</span>
        </a>
        <div class="bar-actions">
          <span class="demo-note">A small, interactive preview</span>
          <button class="restart-button" type="button" data-action="start-guided">Guided demo</button>
          
          <button class="restart-button" type="button" data-action="start-fresh">Start fresh</button>
        </div>
      </header>

      <div class="demo-presentation">
        <aside class="caption-panel" id="caption-panel" aria-live="polite" hidden></aside>
        <section class="stage" aria-label="Koi app preview">
          <div class="phone-frame">
            <div class="phone-screen" id="app-root">
              <div class="status-bar" aria-hidden="true">
                <span id="clock">9:41</span>
                <span class="dynamic-island"></span>
                <span class="status-icons"><i></i><i></i><b></b></span>
              </div>
              <div class="app-header" id="app-header"></div>
              <div class="app-view" id="app-view" aria-live="polite"></div>
              <div class="tab-bar-wrap" id="tab-bar-wrap"></div>
              <div class="home-indicator" aria-hidden="true"></div>
            </div>
          </div>
        </section>
      </div>

      <footer class="demo-footer">
        <span>Demo data stays in this browser.</span>
        <a href="https://github.com/alexandertarica/koi" target="_blank" rel="noreferrer">View the iPhone app on GitHub ↗</a>
      </footer>
    </main>
    <input id="photo-input" type="file" accept="image/*" hidden>
    <script src="app.js?v=8" defer></script>
  </body>
</html>
